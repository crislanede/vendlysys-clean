name: MFA recovery security tests

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/recovery-*.ts'
      - 'supabase/functions/mfa-recovery-*/**'
      - 'supabase/migrations/*mfa_recovery*.sql'
      - '.github/workflows/mfa-recovery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run actual Deno recovery security tests
        run: deno test --allow-env supabase/functions/_shared/recovery-authorization_test.ts supabase/functions/_shared/recovery-crypto_test.ts
      - name: Type check recovery security tests
        run: deno check supabase/functions/_shared/recovery-authorization_test.ts supabase/functions/_shared/recovery-crypto_test.ts
